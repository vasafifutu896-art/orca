name: Portable Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - 'portable-*'

permissions:
  contents: read

concurrency:
  group: portable-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows portable artifacts
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-portable-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-builder-portable-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify portable boundaries
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/startup/portable-profile.test.ts
          src/main/startup/multi-instance-profile.test.ts
          src/main/startup/new-desktop-instance.test.ts
          src/main/startup/windows-notification-activation-wiring.test.ts
          src/main/ipc/windows-foreground-permission.test.ts
          src/main/ipc/windows-notification-activation.test.ts
          src/main/ipc/notification-window-activation.test.ts
          src/main/ipc/notifications.test.ts
          src/main/ipc/register-core-handlers.test.ts
          src/main/ipc/shell.test.ts
          src/main/powershell-osc133-bootstrap.test.ts
          src/main/powershell-osc133-bootstrap-windows-clm.test.ts
          src/main/window/attach-main-window-services.test.ts
          src/main/ipc/filesystem-import-ssh.test.ts
          src/main/ipc/filesystem-import-ssh-ops.test.ts
          src/main/ipc/filesystem-import-ssh-path-safety.test.ts
          src/shared/native-file-drop.test.ts
          src/main/daemon/daemon-host-relocation.test.ts
          src/renderer/src/hooks/useIpcEvents.test.ts
          src/renderer/src/hooks/use-notification-activation-ready.test.ts
          src/renderer/src/components/right-sidebar/RemoteFileToolbar.test.tsx
          src/renderer/src/components/right-sidebar/terminal-manager/TerminalManagerSessionButton.test.tsx
          src/renderer/src/components/right-sidebar/terminal-manager/terminal-manager-session-location.test.ts
          src/renderer/src/components/right-sidebar/terminal-manager/use-terminal-manager-working-directories.test.tsx
          src/renderer/src/components/right-sidebar/FileExplorer.test.tsx
          src/renderer/src/components/right-sidebar/file-explorer-directory-listing.test.ts
          src/renderer/src/components/right-sidebar/file-explorer-reset.test.ts
          src/renderer/src/components/right-sidebar/file-explorer-operation-generation.test.ts
          src/renderer/src/components/right-sidebar/useFileExplorerDragDrop.test.ts
          src/renderer/src/components/right-sidebar/useFileExplorerImport.test.tsx
          src/renderer/src/components/right-sidebar/useFileExplorerKeys.test.ts
          src/renderer/src/components/right-sidebar/useRemoteFileBrowser.test.tsx
          src/renderer/src/components/right-sidebar/useFileExplorerTree.stale-dirs.test.tsx
          src/renderer/src/components/right-sidebar/useFileExplorerVisibleRowProjection.test.ts
          src/renderer/src/store/slices/ssh.test.ts
          config/scripts/build-windows-foreground-permission.test.mjs
          config/scripts/electron-builder-native-rebuild.test.mjs
          config/scripts/electron-builder-config.test.mjs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build portable executable
        env:
          ORCA_REUSE_PREPARED_NATIVE_RUNTIME: '1'
        run: pnpm run build:win:portable

      - name: Verify one-pass portable layout
        shell: pwsh
        run: |
          $artifact = 'dist/orca-windows-portable.exe'
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          $listing = (& $sevenZip l -slt $artifact | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip could not inspect $artifact"
          }
          # Why: normalize CRLF before anchoring paths; .NET's multiline `$` stops before LF but leaves CR.
          $archivePaths = @($listing -split '\r?\n' | ForEach-Object {
            if ($_ -match '^Path = (.+)$') { $Matches[1].Trim() }
          })
          if ($archivePaths -match '(?i)(^|[\\/])app-64\.7z$' -or $archivePaths -match '(?i)(^|[\\/])nsis7z\.dll$') {
            throw 'Portable artifact regressed to nested 7z extraction'
          }
          if (-not ($archivePaths -match '(?i)(^|[\\/])Orca\.exe$')) {
            throw 'Portable artifact does not contain the directly embedded Orca.exe runtime'
          }
          if (-not ($archivePaths -match '(?i)(^|[\\/])resources[\\/]bin[\\/]windows-foreground-permission\.node$')) {
            throw 'Portable artifact is missing the Windows foreground permission addon'
          }
          $nativeAddon = (Resolve-Path 'dist/win-unpacked/resources/bin/windows-foreground-permission.node').Path
          $probe = 'const addon=require(process.argv[1]); process.stdout.write(JSON.stringify(addon.grantWindowsForegroundPermission(0)))'
          $nodeResult = (& node -e $probe $nativeAddon | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $nodeResult -ne '{"granted":false,"inputsSent":0,"errorCode":87}') {
            throw "Node could not load packaged foreground addon: $nodeResult"
          }
          $env:ELECTRON_RUN_AS_NODE = '1'
          try {
            $electronResult = (& 'node_modules/electron/dist/electron.exe' -e $probe $nativeAddon | Out-String).Trim()
            $electronExitCode = $LASTEXITCODE
          } finally {
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          }
          if ($electronExitCode -ne 0 -or $electronResult -ne '{"granted":false,"inputsSent":0,"errorCode":87}') {
            throw "Electron could not load packaged foreground addon: $electronResult"
          }

      - name: Build fast folder-portable archive
        shell: pwsh
        run: |
          $source = (Resolve-Path 'dist/win-unpacked').Path
          $marker = Join-Path $source '.orca-portable'
          [System.IO.File]::WriteAllText($marker, "Orca folder portable`n", [System.Text.Encoding]::ASCII)
          $archivePath = Join-Path $PWD 'dist/orca-windows-portable-folder.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $source,
            $archivePath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($required in @(
              '.orca-portable',
              'Orca.exe',
              'resources/app.asar',
              'resources/bin/windows-foreground-permission.node'
            )) {
              if ($entries -notcontains $required) {
                throw "Folder-portable archive is missing $required"
              }
            }
            if (@($entries | Where-Object { $_ -like 'win-unpacked/*' }).Count -gt 0) {
              throw 'Folder-portable archive has an unexpected win-unpacked directory prefix'
            }
          } finally {
            $archive.Dispose()
          }

      - name: Download .7 startup baseline
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'orca-portable-baseline'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $output = Join-Path $directory 'orca-windows-portable.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/vasafifutu896-art/orca/releases/download/portable-1.4.178-rc.2-multi-instance.7/orca-windows-portable.exe' `
            -OutFile $output
          $actualHash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = 'd6c94948134089c10346743e394cafe859863809a0c5759e702d227ba66b4a0e'
          if ($actualHash -ne $expectedHash) {
            throw "Portable baseline SHA256 mismatch: $actualHash"
          }

      - name: Compare startup to visible window
        shell: pwsh
        run: >-
          ./tests/tools/benchmarks/portable-window-bench.ps1
          -Baseline "$env:RUNNER_TEMP/orca-portable-baseline/orca-windows-portable.exe"
          -Candidate "dist/orca-windows-portable.exe"
          -Iterations 3
          -TimeoutSec 90
          -OutputPath "dist/portable-startup-benchmark.json"

      - name: Verify artifacts and checksums
        shell: pwsh
        run: |
          foreach ($artifact in @(
            'dist/orca-windows-portable.exe',
            'dist/orca-windows-portable-folder.zip'
          )) {
            if (-not (Test-Path $artifact)) {
              throw "Missing portable artifact: $artifact"
            }
            $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumPath = "$artifact.sha256"
            $filename = Split-Path $artifact -Leaf
            [System.IO.File]::WriteAllText(
              $checksumPath,
              "$hash  $filename`n",
              [System.Text.Encoding]::ASCII
            )
          }

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: orca-windows-portable-${{ github.run_id }}
          path: |
            dist/orca-windows-portable.exe
            dist/orca-windows-portable.exe.sha256
            dist/orca-windows-portable-folder.zip
            dist/orca-windows-portable-folder.zip.sha256
            dist/portable-startup-benchmark.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
